[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecosentry"
version = "1.0.0"
description = "Neuromorphic anti-poaching acoustic detection for Indian forest reserves"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10",
    "h5py>=3.8",
    "cryptography>=41.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
ecosentry = "ecosentry.cli:main"

[tool.setuptools]
packages = ["ecosentry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
